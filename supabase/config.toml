project_id = "zorvo"

[api]
enabled = true
port = 54321
# Solo public. El esquema `app` tiene los helpers y el motor: no se expone
# por PostgREST a propósito.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Sin contraseñas: OTP por email + Google OAuth (§3).
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# OTP de 6 dígitos, no magic link: el socio abre el mail en otro dispositivo
# y un link lo dejaría logueado en el equivocado.
otp_length = 6
otp_expiry = 600

[auth.sms]
# Sin SMS: en Argentina el costo por mensaje es alto y la entrega poco
# confiable. Mala elección para un alta gratuita (§3).
enable_signup = false

[analytics]
enabled = false
